<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>caucica - Graphic Designer</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#fff;color:#111}
    
    .hero{
      background: url('cover.png') center/cover no-repeat;
      height: 100vh;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      align-items:center;
      text-align:center;
      position:relative;
      border-bottom: 5px solid #00ff88;
      animation: flashBorder 2s infinite;
      padding: 30px 20px;
    }
    @keyframes flashBorder{0%,100%{border-color:#00ff88}50%{border-color:transparent}}
    
    .hero-top{width:100%;display:flex;justify-content:space-between;align-items:flex-start}
    .nickname{font-size:2.8rem;font-weight:900;color:#00ff88;text-shadow:0 0 15px #00ff88;animation: glow 2s infinite;}
    @keyframes glow{0%,100%{text-shadow:0 0 10px #00ff88}50%{text-shadow:0 0 25px #00ff88}}
    
    .socials{display:flex;gap:12px}
    .socials a{background:rgba(255,255,255,0.9);padding:8px 12px;border-radius:50px;display:flex;align-items:center;gap:6px;text-decoration:none;color:#111;font-weight:bold;font-size:0.85rem}
    .socials img{width:18px;height:18px}
    
    .hero-middle{color:#fff;text-shadow:2px 2px 8px #000}
    .hero-middle h2{font-size:1.3rem;margin-bottom:8px}
    .hero-middle p{font-size:1rem;font-style:italic}
    
    .hero-bottom{display:flex;gap:15px;flex-wrap:wrap;justify-content:center}
    .btn{background:#00ff88;color:#000;padding:14px 28px;border-radius:50px;text-decoration:none;font-weight:bold;font-size:1rem;box-shadow:0 4px 15px rgba(0,255,136,0.4)}
    .btn.white{background:#fff;color:#000}
    
    /* CONTACT SECTION */
    section{padding:60px 20px;max-width:1000px;margin:auto;text-align:center}
    h2{color:#00ff88;margin-bottom:20px;font-size:2rem}
    .contact-box{background:#f5f5f5;padding:30px;border-radius:16px;border:2px solid #00ff88}
    .contact-buttons{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;margin-top:20px}
    
    @media(max-width:600px){
      .nickname{font-size:2.2rem}
      .hero-top{flex-direction:column;align-items:center;gap:15px}
      .socials{flex-direction:column}
    }
  </style>
</head>
<body>

  <header class="hero">
    <!-- TOP -->
    <div class="hero-top">
      <h1 class="nickname">caucica</h1>
      <div class="socials">
        <a href="https://instagram.com/caucica.aa" target="_blank">
          <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="IG"> @caucica.aa
        </a>
        <a href="https://facebook.com/caucica.aa" target="_blank">
          <img src="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" alt="FB"> @caucica.aa
        </a>
      </div>
    </div>

    <!-- MIDDLE -->
    <div class="hero-middle">
      <h2>Rooted in the forest. Flying toward the future.</h2>
      <p>DM 4ur Edits | Minimal design, maximum meaning</p>
    </div>

    <!-- BOTTOM -->
    <div class="hero-bottom">
      <a href="https://wa.me/2347075865938" class="btn" target="_blank">Order on WhatsApp</a>
      <a href="#portfolio" class="btn white">View Portfolio</a>
    </div>
  </header>

  <!-- PORTFOLIO -->
  <section id="portfolio">
    <h2>My Work</h2>
    <img src="nik-vs-marcus.png" alt="Design" style="max-width:600px;width:100%;border-radius:12px">
  </section>

  <!-- CONTACT ME SECTION ADDED BACK -->
  <section id="contact">
    <h2>Contact Me</h2>
    <div class="contact-box">
      <p style="font-size:1.1rem;margin-bottom:10px">Let's work together 🔥</p>
      <p>Need a design like this? DM me and let's talk</p>
      <div class="contact-buttons">
        <a href="https://wa.me/2347075865938" class="btn" target="_blank">WhatsApp Me</a>
        <a href="mailto:firstofmynames@gmail.com
      </div>
    </div>
   </section>

</body>
</html>
