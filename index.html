<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>caucica - Graphic Designer</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    
    body{background:#fff;color:#111}
    
    /* HERO LIKE SENORITA */
    .hero{
      background: url('cover.png') center/cover no-repeat; /* YOUR EDIT PIC */
      height: 90vh;
      min-height: 600px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      position:relative;
      border-bottom: 5px solid #00ff88;
      animation: flashBorder 2s infinite;
    }
    @keyframes flashBorder{
      0%,100%{border-color:#00ff88}
      50%{border-color:#fff}
    }
    
    /* DARK OVERLAY SO TEXT IS VISIBLE */
    .hero::before{
      content:'';
      position:absolute;
      top:0;left:0;right:0;bottom:0;
      background: rgba(0,0,0,0.3); /* makes text readable on image */
    }
    
    .hero-content{position:relative;z-index:2;color:#fff;padding:20px}
    
    .nickname{
      font-size:3rem;
      font-weight:900;
      color:#00ff88;
      text-shadow:0 0 15px #00ff88;
      animation: glow 2s infinite;
    }
    @keyframes glow{0%,100%{text-shadow:0 0 10px #00ff88}50%{text-shadow:0 0 25px #00ff88}}
    
    .tagline{font-size:1.2rem;margin:10px 0 20px;font-style:italic}
    
    .cta-buttons{display:flex;gap:15px;flex-wrap:wrap;justify-content:center}
    .btn{
      background:#00ff88;
      color:#000;
      padding:14px 28px;
      border-radius:50px;
      text-decoration:none;
      font-weight:bold;
      font-size:1rem;
      transition:0.3s;
    }
    .btn:hover{background:#00cc6a;transform:scale(1.05)}
    
    /* SOCIAL BAR LIKE SENORITA */
    .social-bar{
      background:#f5f5f5;
      padding:15px;
      display:flex;
      justify-content:center;
      gap:25px;
      border-bottom:1px solid #ddd;
    }
    .social-bar a{display:flex;align-items:center;gap:8px;text-decoration:none;color:#111;font-weight:bold}
    .social-bar img{width:24px;height:24px}
    
    section{padding:60px 20px;max-width:1000px;margin:auto;text-align:center}
    h2{color:#00ff88;margin-bottom:20px;font-size:2rem}
    
    @media(max-width:600px){
      .nickname{font-size:2.2rem}
      .hero{height:70vh}
    }
  </style>
</head>
<body>

  <!-- HERO SECTION WITH YOUR PIC -->
  <header class="hero">
    <div class="hero-content">
      <h1 class="nickname">caucica</h1>
      <p class="tagline">Rooted in the forest. Flying toward the future.</p>
      <p class="tagline">DM 4ur Edits | Minimal design, maximum meaning</p>
      <div class="cta-buttons">
        <a href="https://wa.me/234XXXXXXXXXX" class="btn" target="_blank">Order on WhatsApp</a>
        <a href="#portfolio" class="btn" style="background:#fff;color:#000">View Portfolio</a>
      </div>
    </div>
  </header>

  <!-- SOCIAL BAR LIKE SENORITA -->
  <div class="social-bar">
    <a href="https://instagram.com/caucica.aa" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="IG"> @caucica.aa
    </a>
    <a href="https://facebook.com/caucica.aa" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" alt="FB"> @caucica.aa
    </a>
  </div>

  <!-- PORTFOLIO SECTION -->
  <section id="portfolio">
    <h2>My Work</h2>
    <img src="nik-vs-marcus.png" alt="Design" style="max-width:600px;width:100%;border-radius:12px">
    <p style="margin-top:15px">Need a design like this? <a href="https://wa.me/2347075865938" style="color:#00ff88">Tap here</a></p>
  </section>

  <!-- CONTACT SECTION -->
  <section id="contact">
    <h2>Let's Work Together</h2>
    <a href="https://wa.me/2347075865938" class="btn">DM Me on WhatsApp</a>
  </section>

</body>
</html>
