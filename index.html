<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>caucica - Graphic Designer</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#fff;color:#111}
    
    .hero{
      background: url('cover.png') center top no-repeat;
      background-size: contain; /* SHOWS FULL IMAGE, NO CROP */
      background-color: #ffffff;
      width: 100%;
      height: auto;
      aspect-ratio: 9/16;
      max-height: 90vh;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      align-items:center;
      text-align:center;
      position:relative;
      border-bottom: 5px solid #00ff88;
      animation: flashBorder 2s infinite;
      padding: 20px 15px;
    }
    @keyframes flashBorder{0%,100%{border-color:#00ff88}50%{border-color:transparent}}
    
    /* TOP: NICKNAME NOW BLACK WITH ASH OUTLINE */
    .hero-top{width:100%;display:flex;justify-content:space-between;align-items:flex-start}
    .nickname{
      font-size:2rem;
      font-weight:900;
      color:#000000; /* BLACK TEXT */
      -webkit-text-stroke: 2px #b0b0b0; /* ASH OUTLINE */
      text-stroke: 2px #b0b0b0; /* for other browsers */
      animation: none; /* REMOVED GLOW */
      text-shadow: none; /* REMOVED GLOW */
    }
    
    .socials{display:flex;flex-direction:column;gap:8px}
    .socials a{background:rgba(255,255,255,0.95);padding:6px 10px;border-radius:50px;display:flex;align-items:center;gap:5px;text-decoration:none;color:#111;font-weight:bold;font-size:0.8rem;border:1px solid #ddd}
    .socials img{width:16px;height:16px}
    
    /* BOTTOM: BUTTONS */
    .hero-bottom{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
    .btn{background:#00ff88;color:#000;padding:12px 22px;border-radius:50px;text-decoration:none;font-weight:bold;font-size:0.95rem;box-shadow:0 0 15px rgba(0,255,136,0.5)}
    .btn.white{background:#fff;color:#000;border:1px solid #ddd}
    
    /* SECTIONS */
    section{padding:50px 20px;max-width:1000px;margin:auto;text-align:center}
    h2{color:#00ff88;margin-bottom:20px;font-size:1.8rem}
    .contact-box{background:#f5f5f5;padding:25px;border-radius:16px;border:2px solid #00ff88}
    .contact-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:15px}
    
    @media(max-width:600px){
      .nickname{font-size:1.8rem;-webkit-text-stroke: 1.5px #b0b0b0;}
      .hero{aspect-ratio: 9/19;}
    }
  </style>
</head>
<body>

  <header class="hero">
    <!-- TOP -->
    <div class="hero-top">
      <h1 class="nickname">caucica</h1>
      <div class="socials">
        <a href="https://instagram.com/caucica.aa" target="_blank">
          <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="IG"> @caucica.aa
        </a>
        <a href="https://facebook.com/caucica.aa" target="_blank">
          <img src="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" alt="FB"> @caucica.aa
        </a>
      </div>
    </div>

    <!-- BOTTOM -->
    <div class="hero-bottom">
      <a href="https://wa.me/2347075865938" class="btn" target="_blank">Order on WhatsApp</a>
      <a href="#portfolio" class="btn white">View Portfolio</a>
    </div>
  </header>

  <!-- PORTFOLIO -->
  <section id="portfolio">
    <h2>My Work</h2>
    <img src="nik-vs-marcus.png" alt="Design" style="max-width:600px;width:100%;border-radius:12px">
  </section>

  <!-- CONTACT -->
  <section id="contact">
    <h2>Contact Me</h2>
    <div class="contact-box">
      <p style="font-size:1.1rem;margin-bottom:10px">Let's work together 🔥</p>
      <div class="contact-buttons">
        <a href="https://wa.me/2347075865938" class="btn" target="_blank">WhatsApp Me</a>
        <a href="mailto:firstofmynames@gmail.com" class="btn white" target="_blank">Email Me</a>
      </div>
    </div>
  </section>

</body>
  </html>
